services:
  - type: web
    name: financetracker-ai
    env: python
    region: oregon
    plan: free
    rootDir: backend/ai_engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
