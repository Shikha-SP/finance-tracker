[build]
  command = "npm install && npm install --prefix frontend && npm run build"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API calls to the Vercel backend.
[[redirects]]
  from = "/api/*"
  to = "https://finance-tracker-sand-seven.vercel.app/api/:splat"
  status = 200

# SPA fallback: every other route serves index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200